<VirtualHost *:80>
  ServerName crayfish.dgi

  ## Vhost docroot
  DocumentRoot "/opt/www/crayfish"

  DirectoryIndex index.php
  SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1

  # Dummy endpoint for container health checks, kept out of the access log
  # (see CustomLog directive in apache2.conf) so it doesn't pollute logs.
  SetEnvIf Request_URI "^/healthz$" dontlog

  # Dummy endpoint for the health check - served directly by
  # Apache without touching PHP/Houdini. Deliberately kept outside
  # DocumentRoot (/opt/www/crayfish) so it doesn't interfere with the
  # composer-owned /opt/www tree created later in the image build.
  Alias "/healthz" "/opt/www-healthz/healthz.html"
  <Files "healthz.html">
    Require all granted
  </Files>

  Alias "/homarus" "/opt/www/crayfish/Homarus/public"
  <Directory "/opt/www/crayfish/Homarus/public">
    FallbackResource /homarus/index.php
    Require all granted
  </Directory>

  Alias "/houdini" "/opt/www/crayfish/Houdini/public"
  <Directory "/opt/www/crayfish/Houdini/public">
    FallbackResource /houdini/index.php
    Require all granted
  </Directory>

  Alias "/hypercube" "/opt/www/crayfish/Hypercube/public"
  <Directory "/opt/www/crayfish/Hypercube/public">
    FallbackResource /hypercube/index.php
    Require all granted
  </Directory>

  ServerAlias localhost
</VirtualHost>
