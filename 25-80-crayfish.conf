<VirtualHost *:80>
  ServerName crayfish.dgi

  ## Vhost docroot
  DocumentRoot "/opt/www/crayfish"

  DirectoryIndex index.php
  SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1

  # Requests from our health checks (identified by User-Agent, see
  # healthcheck.sh / readinesscheck.sh) are kept out of the access log
  # (see CustomLog directive in apache2.conf) so they don't pollute logs,
  # regardless of which endpoint they hit.
  SetEnvIf User-Agent "^healthcheck$" dontlog

  # Dummy endpoint for the frequent liveness check - served directly by
  # Apache without touching PHP/Houdini.
  Alias "/healthz" "/opt/www/healthz.html"
  <Files "healthz.html">
    Require all granted
  </Files>

  Alias "/homarus" "/opt/www/crayfish/Homarus/public"
  <Directory "/opt/www/crayfish/Homarus/public">
    FallbackResource /homarus/index.php
    Require all granted
  </Directory>

  Alias "/houdini" "/opt/www/crayfish/Houdini/public"
  <Directory "/opt/www/crayfish/Houdini/public">
    FallbackResource /houdini/index.php
    Require all granted
  </Directory>

  Alias "/hypercube" "/opt/www/crayfish/Hypercube/public"
  <Directory "/opt/www/crayfish/Hypercube/public">
    FallbackResource /hypercube/index.php
    Require all granted
  </Directory>

  ServerAlias localhost
</VirtualHost>
